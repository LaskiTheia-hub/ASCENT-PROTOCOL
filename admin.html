<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARGUS Admin</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div>
        <div class="kicker">ARGUS ADMIN CONSOLE</div>
        <h1>TEST MONITOR</h1>
        <p class="subtitle">참가자별 진행도와 이벤트 로그를 확인합니다. 특정 ID의 진행도만 초기화할 수 있습니다.</p>
      </div>
      <div class="status"><span id="adminUser">ADMIN</span><br><button id="logoutBtn" class="danger">LOGOUT</button></div>
    </div>
    <section class="panel">
      <button id="refreshBtn">새로고침</button>
      <button id="downloadBtn">CSV 다운로드</button>
      <div class="inputrow" style="max-width:520px">
        <input id="resetId" placeholder="초기화할 ID 예: 06101">
        <button id="resetBtn" class="danger">해당 ID 진행도 초기화</button>
      </div>
      <div id="adminMsg" class="msg"></div>
      <table class="admin-table">
        <thead><tr><th>ID</th><th>Pair</th><th>Role</th><th>Stage</th><th>Done</th><th>Updated</th><th>Reset</th></tr></thead>
        <tbody id="progressBody"></tbody>
      </table>
      <h2>EVENT LOG</h2>
      <table class="admin-table">
        <thead><tr><th>Time</th><th>ID</th><th>Pair</th><th>Role</th><th>Type</th><th>Payload</th></tr></thead>
        <tbody id="eventBody"></tbody>
      </table>
    </section>
  </main>
  <script type="module" src="./admin.js"></script>
</body>
</html>
