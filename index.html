<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARGUS Portal</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div>
        <div class="kicker">ARGUS RESEARCH FACILITY</div>
        <h1>COGNITIVE PAIR TEST</h1>
      </div>
      <div class="status">ASCENT PROTOCOL<br>PAIR ACCESS</div>
    </div>

    <section id="loginView" class="loginbox">
      <div class="formrow">
        <label for="loginId">ID</label>
        <input id="loginId" placeholder="06101" inputmode="numeric">

        <label for="loginPw">PW</label>
        <input id="loginPw" type="password" placeholder="******">

        <button id="loginBtn">LOGIN</button>
      </div>
      <div id="loginMsg" class="msg"></div>
    </section>

    <section id="loadingView" class="panel hidden">인증 상태 확인 중입니다.</section>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
