<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARGUS / 선택 편향 실험</title><link rel="stylesheet" href="./style.css"></head><body><main class="shell"><header><div class="eyebrow">ASCENT PROTOCOL · 61ST COHORT</div><h1>선택 편향 실험</h1><p class="intro">열 가지 항목 중 하나를 선택하십시오. 선택은 변경할 수 없습니다.</p></header><section id="login" class="panel"><h2>ACCESS</h2><label>ID<input id="id" placeholder="06101" autocomplete="username"></label><label>PW<input id="pw" type="password" autocomplete="current-password"></label><button id="loginBtn">접속</button></section><section id="main" hidden><div class="toolbar"><span id="who"></span><button id="logoutBtn" class="ghost">로그아웃</button></div><div id="selection" hidden><h2>SELECTION LIST</h2><p class="muted">항목명만 공개됩니다. 선택된 항목은 다른 참가자가 선택할 수 없습니다.</p><div id="items" class="items"></div></div><div id="result" hidden class="panel"><div class="eyebrow">SELECTED ITEM</div><h2 id="chosenName"></h2><div id="effect" class="effect"></div><p class="muted">해당 효과는 선택 시점부터 72시간 동안 적용됩니다.</p></div><div id="admin" hidden class="panel"><h2>ADMIN / 전체 선택 현황</h2><div id="adminList"></div><div id="adminPreview" hidden class="panel" style="margin-top:20px"><div class="eyebrow">ADMIN PREVIEW · 저장되지 않음</div><h2 id="adminPreviewName"></h2><div id="adminPreviewEffect" class="effect"></div></div></div></section><p id="message" role="status"></p><footer>ARGUS · RESTRICTED ACCESS</footer></main><script type="module" src="./app.js"></script></body></html>
